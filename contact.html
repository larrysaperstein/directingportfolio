<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact – Larry Saperstein</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAV -->
  <nav class="navbar">
    <a href="index.html#top" class="logo">LS</a>
    <div class="nav-links">
      <a href="index.html#directing">Directing</a>
      <a href="index.html#design">Design</a>
      <a href="/websites">Websites</a>
      <a href="https://www.larrysaperstein.com" target="_blank">
        Performance &amp; Tap Dance
      </a>
      <a href="/contact">Contact</a>
    </div>

  <div class="hamburger" aria-label="Open navigation" tabindex="0">
    <span></span>
    <span></span>
    <span></span>
  </div>

  </nav>

  <section class="project-hero">
    <h1>Contact</h1>
  </section>

  <section class="contact-section" id="contact-section">
    <form action="https://api.web3forms.com/submit" method="POST" id="contact-form" class="contact-form">
      <input type="hidden" name="access_key" value="a2109461-b95a-4925-8e5d-7bf620b5ed17">
      <input type="hidden" name="subject" value="New message from Larry Saperstein portfolio">
      <input type="checkbox" name="botcheck" style="display: none;">

      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone">

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit" class="project-button-alt contact-submit">Submit</button>
    </form>
  </section>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-socials">
        <a href="https://www.instagram.com" target="_blank">
          <img src="images/icon-instagram.svg" alt="Instagram">
        </a>
        <a href="https://www.tiktok.com" target="_blank">
          <img src="images/icon-tiktok.svg" alt="TikTok">
        </a>
        <a href="https://www.youtube.com" target="_blank">
          <img src="images/icon-youtube.svg" alt="YouTube">
        </a>
      </div>

      <div class="footer-copyright">
        ©2026 – Larry Saperstein
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    const contactSection = document.getElementById('contact-section');
    const contactForm = document.getElementById('contact-form');

    contactForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const submitButton = contactForm.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'Sending...';

      const formData = new FormData(contactForm);
      const payload = JSON.stringify(Object.fromEntries(formData));

      fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: payload
      })
        .then(async (response) => {
          const json = await response.json();
          if (response.status === 200) {
            contactSection.innerHTML =
              '<div class="contact-success"><p>Thanks for reaching out! We\'ll be in touch!</p></div>';
          } else {
            submitButton.disabled = false;
            submitButton.textContent = 'Submit';
            alert(json.message || 'Something went wrong. Please try again.');
          }
        })
        .catch(() => {
          submitButton.disabled = false;
          submitButton.textContent = 'Submit';
          alert('Something went wrong. Please try again.');
        });
    });
  </script>

</body>
</html>
